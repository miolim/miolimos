# Self-hosting miolimOS with Docker Compose (app + PostgreSQL).
#
# A fresh clone cannot decrypt the maintainer's credentials, so you must
# provide YOUR OWN Rails master key. Generate credentials first (see the
# README "Quick start"), then:
#
#   RAILS_MASTER_KEY=$(cat config/master.key) docker compose up --build
#
# Works on Linux, macOS (Intel and Apple Silicon) and Windows with Docker
# Desktop: the image is built locally from this repository, and both base
# images (ruby, postgres) are multi-architecture. The pre-built image on
# ghcr.io is amd64 only — on Apple Silicon prefer `--build` over pulling it.
#
# The app will be available on http://localhost:3000. The entrypoint runs
# `db:prepare` automatically (creates + migrates the primary/cache/queue
# databases on first boot). Background jobs run inside Puma
# (SOLID_QUEUE_IN_PUMA), so no separate worker container is needed.
#
# Plain HTTP on localhost is the default here (MIOLIMOS_PROTOCOL=http), which
# turns off force_ssl and points the Action Cable origin at http. Putting this
# behind a TLS-terminating proxy? Set MIOLIMOS_PROTOCOL=https, MIOLIMOS_HOST to
# your domain, and drop MIOLIMOS_CABLE_ORIGINS.

name: miolimos

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${MIOLIMOS_DB_USER:-miolimos_src}
      POSTGRES_PASSWORD: ${MIOLIMOS_SRC_DATABASE_PASSWORD:-miolimos}
      POSTGRES_DB: miolimos_production
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MIOLIMOS_DB_USER:-miolimos_src}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      # Required: your own master key (cat config/master.key).
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set RAILS_MASTER_KEY, e.g. RAILS_MASTER_KEY=$(cat config/master.key)}
      MIOLIMOS_DB_HOST: db
      MIOLIMOS_DB_USER: ${MIOLIMOS_DB_USER:-miolimos_src}
      MIOLIMOS_SRC_DATABASE_PASSWORD: ${MIOLIMOS_SRC_DATABASE_PASSWORD:-miolimos}
      MIOLIMOS_HOST: ${MIOLIMOS_HOST:-localhost:3000}
      MIOLIMOS_PROTOCOL: ${MIOLIMOS_PROTOCOL:-http}
      MIOLIMOS_CABLE_ORIGINS: ${MIOLIMOS_CABLE_ORIGINS:-http://localhost:3000}
      # Run background jobs (Solid Queue) inside the Puma process.
      SOLID_QUEUE_IN_PUMA: "true"
      # Set explicitly so the volume below cannot drift from the application's
      # default (~/miolimos, which resolves to /home/rails/miolimos in the
      # image).
      MIOLIMOS_DATA_PATH: /home/rails/miolimos
    volumes:
      # WITHOUT THESE TWO the database survives a container rebuild and the
      # files do not. Everything the application writes to disk lives here:
      # the knowledge Markdown, and — this is the part that cannot be
      # reconstructed — every attachment: invoices, settlement documents,
      # meter photos, profile images. The database keeps only their path, so
      # after `docker compose up --build` you would get a complete-looking
      # database full of references to files that no longer exist, without a
      # single error message.
      - app_data:/home/rails/miolimos
      - app_storage:/rails/storage
    ports:
      - "3000:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  app_data:
  app_storage:
