  label: knowledge.editors.contacts.add
kontaktweg_nummer_kopieren:
  icon: copy
  label: knowledge.editors.contacts.copy_number
mail_mit_text_schreiben:
  icon: mail_plus
  label: knowledge.editors.contacts.compose_with_text
kontaktweg_entfernen:
  icon: x
  label: knowledge.editors.contacts.remove

kennung_bearbeiten:
  icon: pencil
  label: actions.edit
kennung_hinzufuegen:
  icon: plus_circle
  label: knowledge.editors.identifiers.add
# Die Beschriftung trägt einen Platzhalter (%{label}) — der Aufruf reicht den
# fertigen Text als title mit.
kennung_kopieren:
  icon: copy
  label: knowledge.editors.identifiers.add
kennung_entfernen:
